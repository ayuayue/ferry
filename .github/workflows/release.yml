name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test affected Go packages
        run: go test ./internal/svc ./cmd/engine-setup

      - name: Build installer and application
        run: npx --no-install mygo build -platform windows/amd64

      - name: Check elevated helper manifest
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content -Raw resources/engine-setup.exe.manifest)
          $level = $manifest.assembly.trustInfo.security.requestedPrivileges.requestedExecutionLevel.level
          if ($level -ne "requireAdministrator") { throw "Unexpected helper execution level: $level" }
          $helper = Resolve-Path build/windows-amd64/engine-setup.exe
          $runtime = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($helper))
          if (-not $runtime.Contains("requireAdministrator")) { throw "The packaged engine helper manifest is missing." }

      - name: Zip portable application with engine
        shell: pwsh
        run: |
          $dir = Resolve-Path build/windows-amd64
          Get-ChildItem $dir -Exclude "ferry-setup-*" | Compress-Archive -DestinationPath "build/ferry-portable-windows-amd64.zip" -Force

      - name: Check portable redistribution notices
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $path = Join-Path (Get-Location) "build/ferry-portable-windows-amd64.zip"
          $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
          try {
            $names = $zip.Entries.FullName | ForEach-Object { $_.Replace('\', '/') }
            $required = @(
              "Ferry.exe",
              "engine-setup.exe",
              "THIRD_PARTY_NOTICES.md",
              "licenses/Ferry-LICENSE.txt",
              "licenses/MyGo-LICENSE.txt",
              "licenses/PureGo-LICENSE.txt",
              "licenses/Go-LICENSE.txt",
              "licenses/React-LICENSE.txt",
              "licenses/Lucide-LICENSE.txt",
              "licenses/Golang-X-Net-LICENSE.txt",
              "licenses/Golang-X-Sys-LICENSE.txt",
              "licenses/Golang-X-Text-LICENSE.txt",
              "engine/win/amd64/LICENSE.ProxyBridge.txt",
              "engine/win/amd64/LICENSE.WinDivert.txt"
            )
            foreach ($file in $required) {
              if ($names -notcontains $file) { throw "Portable archive is missing $file" }
            }
          } finally {
            $zip.Dispose()
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ferry-windows-amd64
          path: |
            build/windows-amd64/ferry-setup-*-amd64.exe
            build/*-portable-windows-amd64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test the Linux engine client against a fake daemon
        run: go test ./internal/pbproto

      - name: Build application
        env:
          CGO_ENABLED: "0"
        run: npx --no-install mygo build -platform linux/amd64

      - name: Package deb and tarball
        run: bash scripts/package-linux.sh

      - name: Check packaged contents
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(build/linux-amd64/ferry_*_amd64.deb)
          tarballs=(build/linux-amd64/ferry-*-linux-amd64.tar.gz)
          if [ "${#debs[@]}" -ne 1 ]; then echo "Expected one deb, found ${#debs[@]}" >&2; exit 1; fi
          if [ "${#tarballs[@]}" -ne 1 ]; then echo "Expected one tarball, found ${#tarballs[@]}" >&2; exit 1; fi
          deb="${debs[0]}"
          listing="$(dpkg-deb -c "$deb")"
          required=(
            "./opt/ferry/engine/linux/amd64/ProxyBridge"
            "./opt/ferry/engine/linux/amd64/LICENSE.ProxyBridge.txt"
            "./opt/ferry/licenses/Ferry-LICENSE.txt"
            "./opt/ferry/THIRD_PARTY_NOTICES.md"
            "./usr/share/applications/ferry.desktop"
          )
          for file in "${required[@]}"; do
            if ! grep -q -- " $file\$" <<<"$listing"; then echo "Package is missing $file" >&2; exit 1; fi
          done
          if ! grep -qE '^-rwx.* \./opt/ferry/ferry$' <<<"$listing"; then
            echo "Package is missing the application binary" >&2
            exit 1
          fi
          if ! grep -qF './usr/bin/ferry -> /opt/ferry/ferry' <<<"$listing"; then
            echo "Package is missing the /usr/bin launcher" >&2
            exit 1
          fi
          if grep -q 'engine/win\|engine-setup' <<<"$listing"; then
            echo "Windows payload leaked into the Linux package" >&2
            exit 1
          fi
          deps="$(dpkg-deb -f "$deb" Depends)"
          grep -q 'libwebkit2gtk-4.1-0' <<<"$deps" || { echo "Missing WebKitGTK dependency: $deps" >&2; exit 1; }
          grep -q 'libgtk-3-0' <<<"$deps" || { echo "Missing GTK dependency: $deps" >&2; exit 1; }
          tarlist="$(mktemp)"
          tar -tzf "${tarballs[0]}" > "$tarlist"
          for file in ferry/engine/linux/amd64/ProxyBridge ferry/THIRD_PARTY_NOTICES.md ferry/licenses/Ferry-LICENSE.txt; do
            if ! grep -qxF "$file" "$tarlist"; then echo "Tarball is missing $file" >&2; exit 1; fi
          done
          rm -f "$tarlist"
          printf 'Verified %s and %s\n' "$deb" "${tarballs[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/linux-amd64/ferry_*_amd64.deb
            build/linux-amd64/ferry-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ferry-windows-amd64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find release-assets -type f -name 'ferry-setup-*-amd64.exe' -print)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one Windows installer, found ${#installers[@]}" >&2
            exit 1
          fi
          if [ ! -s release-assets/ferry-portable-windows-amd64.zip ]; then
            echo "Portable Windows archive is missing" >&2
            exit 1
          fi
          mapfile -t debs < <(find release-assets -type f -name '*_amd64.deb' -print)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected one Linux deb, found ${#debs[@]}" >&2
            exit 1
          fi
          mapfile -t tarballs < <(find release-assets -type f -name '*-linux-amd64.tar.gz' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected one Linux tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          printf 'Verified: %s | %s | %s\n' "${installers[0]}" "${debs[0]}" "${tarballs[0]}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/*.zip
            release-assets/*.deb
            release-assets/*.tar.gz
